[pytest]
testpaths = tests
pythonpath = src
addopts = -ra
markers =
    evidence: re-fits committed AEMO evidence bundles, or a tampered copy of one (no raw downloads needed; ~1.5-5 s per fit)
    rawdata: needs the raw AEMO / NASA POWER downloads under INVISIBLE_SOLAR_DATA (default: data/); skipped when absent
filterwarnings =
    error::statsmodels.tools.sm_exceptions.SingularMatrixWarning
    # pandas 3 deprecates these accessors; they sit in the hash-anchored estimator modules
    # (features.py, hidden_pv.py), which cannot change without re-anchoring the attestations
    ignore:DatetimeIndex\.(dayofweek|dayofyear) is deprecated
